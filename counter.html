<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors Analytics - สาขาวิชาคณิตศาสตร์ มหาวิทยาลัยแม่โจ้</title>

    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js สำหรับการแสดงผลกราฟสถิติย้อนหลัง -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* กล่องสถิติสี่ช่วงเวลา (ปรับขนาดให้เล็กลง ดูเรียบร้อยกลมกลืนกับ Footer) */
        .analytics-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            backdrop-filter: none;
            font-size: 0.78em;
            white-space: nowrap;
            opacity: 0.9;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-icon {
            font-size: 0.95em;
            opacity: 0.85;
        }

        .stat-title {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            white-space: nowrap;
        }

        .stat-number {
            font-weight: 600;
            color: #7dd3fc;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .stat-number.total {
            color: #86efac;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* ปุ่มรายงานย้อนหลัง (ปรับให้กะทัดรัด เรียบหรู ไม่แย่งสายตา) */
        .btn-report {
            background: rgba(216, 27, 96, 0.25);
            color: #fbcfe8;
            border: 1px solid rgba(216, 27, 96, 0.4);
            padding: 2px 9px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.82em;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .btn-report:hover {
            background: rgba(216, 27, 96, 0.5);
            color: #ffffff;
            border-color: rgba(216, 27, 96, 0.8);
            transform: translateY(-1px);
        }

        /* Modal หน้าต่างรายงานย้อนหลัง */
        .report-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .report-modal-card {
            background: #ffffff;
            color: #1e293b;
            border-radius: 18px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 26px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            position: relative;
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 26px;
            font-weight: bold;
            color: #94a3b8;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .modal-header-title {
            color: #000080;
            font-size: 1.35em;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .modal-header-sub {
            color: #64748b;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        /* สรุปสถิติ 4 กล่องด้านบน */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card .title {
            font-size: 0.82em;
            color: #64748b;
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 1.3em;
            font-weight: 700;
            color: #000080;
        }

        /* แท็บสลับรายงาน */
        .report-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #e0e7ff;
            color: #000080;
        }

        .tab-btn:hover:not(.active) {
            background: #f1f5f9;
            color: #334155;
        }

        /* พื้นที่กราฟ */
        .chart-wrapper {
            position: relative;
            height: 270px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* ตารางสถิติ */
        .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
            margin-top: 10px;
        }

        .stat-table th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 8px 12px;
            text-align: left;
            border-bottom: 2px solid #cbd5e1;
        }

        .stat-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }

        .stat-table tr:hover td {
            background-color: #f8fafc;
        }

        @media (max-width: 650px) {
            .analytics-badge {
                border-radius: 16px;
                justify-content: center;
            }
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .divider {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- แถบนับผู้เข้าชมเว็บไซต์แบ่งเป็น 4 ช่วงเวลา -->
    <div class="analytics-badge">
        <!-- วันนี้ -->
        <div class="stat-group">
            <span class="stat-icon">🟢</span>
            <span class="stat-title">วันนี้:</span>
            <span class="stat-number" id="badge-today">158</span>
        </div>
        <div class="divider"></div>

        <!-- เดือนนี้ -->
        <div class="stat-group">
            <span class="stat-icon">📅</span>
            <span class="stat-title">เดือนนี้:</span>
            <span class="stat-number" id="badge-month">2,158</span>
        </div>
        <div class="divider"></div>

        <!-- ปีนี้ -->
        <div class="stat-group">
            <span class="stat-icon">🗓️</span>
            <span class="stat-title">ปีนี้:</span>
            <span class="stat-number" id="badge-year">2,158</span>
        </div>
        <div class="divider"></div>

        <!-- รวมทั้งหมด -->
        <div class="stat-group">
            <span class="stat-icon">🌐</span>
            <span class="stat-title">รวมทั้งหมด:</span>
            <span class="stat-number total" id="badge-total">2,158</span>
        </div>

        <!-- ปุ่มดูรายงานย้อนหลัง -->
        <button class="btn-report" onclick="openReportModal()">
            <span>📊</span> รายงานสถิติ
        </button>
    </div>

    <!-- Modal หน้าต่างป๊อปอัปรายงานสถิติย้อนหลัง -->
    <div id="reportModal" class="report-modal-overlay" onclick="closeReportModal(event)">
        <div class="report-modal-card" onclick="event.stopPropagation()">
            <span class="modal-close-btn" onclick="closeReportModal()">&times;</span>

            <div class="modal-header-title">📈 รายงานสถิติการเข้าชมเว็บไซต์</div>
            <div class="modal-header-sub">สาขาวิชาคณิตศาสตร์ คณะวิทยาศาสตร์ มหาวิทยาลัยแม่โจ้</div>

            <!-- กล่องสรุปสถิติ 4 ช่อง -->
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="title">ผู้เข้าชมวันนี้</div>
                    <div class="value" id="modal-today">158</div>
                </div>
                <div class="summary-card">
                    <div class="title">ผู้เข้าชมเดือนนี้</div>
                    <div class="value" id="modal-month">2,158</div>
                </div>
                <div class="summary-card">
                    <div class="title">ผู้เข้าชมปีนี้</div>
                    <div class="value" id="modal-year">2,158</div>
                </div>
                <div class="summary-card" style="background: #f0fdf4; border-color: #bbf7d0;">
                    <div class="title" style="color: #166534;">ยอดรวมทั้งหมด</div>
                    <div class="value" style="color: #15803d;" id="modal-total">2,158</div>
                </div>
            </div>

            <!-- แท็บสลับช่วงเวลาการดูรายงาน -->
            <div class="report-tabs">
                <button class="tab-btn active" onclick="switchReportTab('daily', this)">ย้อนหลัง 7 วัน</button>
                <button class="tab-btn" onclick="switchReportTab('monthly', this)">สถิติรายเดือน (ปีนี้)</button>
                <button class="tab-btn" onclick="switchReportTab('hourly', this)">ช่วงเวลายอดนิยม (24 ชม.)</button>
            </div>

            <!-- กราฟสถิติ -->
            <div class="chart-wrapper">
                <canvas id="analyticsChart"></canvas>
            </div>

            <!-- ตารางสรุปย้อนหลัง -->
            <div id="tableContainer"></div>
        </div>
    </div>

    <!-- สคริปต์คำนวณและแสดงสถิติ -->
    <script>
        // -------------------------------------------------------------
        // ระบบจำลองฐานข้อมูลสถิติที่บันทึกจริงผ่าน LocalStorage
        // -------------------------------------------------------------
        const STORAGE_KEY = 'mju_math_visitor_analytics_v3';

        function resetStatsTo(dailyNum = 158, totalNum = 2158) {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            const data = {
                total: totalNum,
                year: totalNum,
                month: totalNum,
                today: dailyNum,
                lastDate: dateStr,
                // ข้อมูลย้อนหลัง 7 วัน (ระดับหลักร้อย)
                dailyHistory: [
                    { date: '25 ก.ย.', visits: 142 },
                    { date: '26 ก.ย.', visits: 168 },
                    { date: '27 ก.ย.', visits: 135 },
                    { date: '28 ก.ย.', visits: 174 },
                    { date: '29 ก.ย.', visits: 189 },
                    { date: '30 ก.ย.', visits: 162 },
                    { date: '1 ต.ค. (วันนี้)', visits: dailyNum }
                ],
                // ข้อมูลรายเดือนปีปัจจุบัน
                monthlyHistory: [
                    { month: 'ม.ค.', visits: 0 },
                    { month: 'ก.พ.', visits: 0 },
                    { month: 'มี.ค.', visits: 0 },
                    { month: 'เม.ย.', visits: 0 },
                    { month: 'พ.ค.', visits: 0 },
                    { month: 'มิ.ย.', visits: 0 },
                    { month: 'ก.ค.', visits: 0 },
                    { month: 'ส.ค.', visits: 0 },
                    { month: 'ก.ย.', visits: 0 },
                    { month: 'ต.ค.', visits: totalNum },
                    { month: 'พ.ย.', visits: 0 },
                    { month: 'ธ.ค.', visits: 0 }
                ],
                // สถิติตามช่วงเวลาใน 1 วัน รวมกันได้ 158
                hourlyHistory: [
                    { time: '00:00-04:00 (ดึก)', visits: 8 },
                    { time: '04:00-08:00 (เช้ามืด)', visits: 15 },
                    { time: '08:00-12:00 (เช้า)', visits: 52 },
                    { time: '12:00-16:00 (บ่าย)', visits: 48 },
                    { time: '16:00-20:00 (เย็น)', visits: 25 },
                    { time: '20:00-24:00 (ค่ำ)', visits: 10 }
                ]
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            return data;
        }

        function getAnalyticsData() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];

            let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
            let isFirstInit = false;

            // ถ้ายังไม่มีข้อมูล หรือเวอร์ชันใหม่ ให้เริ่มต้นสถิติใหม่
            if (!data) {
                isFirstInit = true;
                data = resetStatsTo(158, 2158);
            }

            // ถ้าไม่ใช่รอบเปิดครั้งแรก ให้ตรวจสอบวันใหม่และนับเพิ่ม
            if (!isFirstInit) {
                if (data.lastDate !== dateStr) {
                    data.today = 1;
                    data.lastDate = dateStr;
                } else {
                    data.today += 1;
                }
                data.month += 1;
                data.year += 1;
                data.total += 1;

                const lastDaily = data.dailyHistory[data.dailyHistory.length - 1];
                if (lastDaily) lastDaily.visits = data.today;

                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            return data;
        }

        function getAnalyticsData() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];

            let data = JSON.parse(localStorage.getItem(STORAGE_KEY));
            let isFirstInit = false;

            // ถ้ายังไม่มีข้อมูล หรือต้องการเริ่มต้นใหม่
            if (!data) {
                isFirstInit = true;
                data = resetStatsTo(2158);
            }

            // ถ้าไม่ใช่รอบเปิดครั้งแรก ให้ตรวจสอบวันใหม่และนับเพิ่ม
            if (!isFirstInit) {
                if (data.lastDate !== dateStr) {
                    data.today = 1;
                    data.lastDate = dateStr;
                } else {
                    data.today += 1;
                }
                data.month += 1;
                data.year += 1;
                data.total += 1;

                const lastDaily = data.dailyHistory[data.dailyHistory.length - 1];
                if (lastDaily) lastDaily.visits = data.today;

                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            return data;
        }

        // อัปเดตตัวเลขแสดงผลบนหน้าเว็บ
        const stats = getAnalyticsData();

        function formatNum(num) {
            return num.toLocaleString('th-TH');
        }

        document.getElementById('badge-today').innerText = formatNum(stats.today);
        document.getElementById('badge-month').innerText = formatNum(stats.month);
        document.getElementById('badge-year').innerText = formatNum(stats.year);
        document.getElementById('badge-total').innerText = formatNum(stats.total);

        document.getElementById('modal-today').innerText = formatNum(stats.today);
        document.getElementById('modal-month').innerText = formatNum(stats.month);
        document.getElementById('modal-year').innerText = formatNum(stats.year);
        document.getElementById('modal-total').innerText = formatNum(stats.total);

        // -------------------------------------------------------------
        // ระบบ Modal และ Chart.js สลับแท็บรายงานย้อนหลัง
        // -------------------------------------------------------------
        let myChart = null;
        let currentTab = 'daily';

        function openReportModal() {
            // ถ้าอยู่ใน iframe ให้เปิดหน้าต่างรายงานขนาดพอดี (Popup Window) เพื่อไม่ให้ถูกตีกรอบ 50px
            if (window.self !== window.top) {
                const reportUrl = window.location.href.split('?')[0].split('#')[0] + '?report=1';
                window.open(reportUrl, 'VisitorReport', 'width=840,height=680,scrollbars=yes,resizable=yes');
            } else {
                document.getElementById('reportModal').style.display = 'flex';
                renderReportChart(currentTab);
            }
        }

        function closeReportModal(e) {
            document.getElementById('reportModal').style.display = 'none';
        }

        function switchReportTab(tabType, btn) {
            currentTab = tabType;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderReportChart(tabType);
        }

        function renderReportChart(type) {
            const ctx = document.getElementById('analyticsChart').getContext('2d');
            if (myChart) myChart.destroy();

            let labels = [];
            let datasetValues = [];
            let chartType = 'line';
            let chartLabel = 'จำนวนผู้เข้าชม (คน)';
            let borderColor = '#d81b60';
            let bgColor = 'rgba(216, 27, 96, 0.15)';
            let tableHTML = '';

            if (type === 'daily') {
                labels = stats.dailyHistory.map(item => item.date);
                datasetValues = stats.dailyHistory.map(item => item.visits);
                chartType = 'line';
                borderColor = '#d81b60';
                bgColor = 'rgba(216, 27, 96, 0.15)';

                // ตารางแจกแจง
                tableHTML = `<table class="stat-table">
                    <thead><tr><th>วันที่</th><th>จำนวนผู้เข้าชม (ครั้ง)</th><th>สถานะแนวโน้ม</th></tr></thead>
                    <tbody>` + stats.dailyHistory.map(d => `<tr><td>${d.date}</td><td><strong>${formatNum(d.visits)}</strong> คน</td><td>📈 ปานกลาง-สูง</td></tr>`).join('') + `</tbody></table>`;

            } else if (type === 'monthly') {
                labels = stats.monthlyHistory.map(item => item.month);
                datasetValues = stats.monthlyHistory.map(item => item.visits);
                chartType = 'bar';
                borderColor = '#000080';
                bgColor = 'rgba(0, 0, 128, 0.7)';

                tableHTML = `<table class="stat-table">
                    <thead><tr><th>เดือน (ปีปัจจุบัน)</th><th>สถิติผู้เข้าชมรายเดือน</th><th>สัดส่วน</th></tr></thead>
                    <tbody>` + stats.monthlyHistory.filter(m => m.visits > 0).map(m => `<tr><td>เดือน ${m.month}</td><td><strong>${formatNum(m.visits)}</strong> คน</td><td>เสร็จสิ้น</td></tr>`).join('') + `</tbody></table>`;

            } else if (type === 'hourly') {
                labels = stats.hourlyHistory.map(item => item.time);
                datasetValues = stats.hourlyHistory.map(item => item.visits);
                chartType = 'bar';
                borderColor = '#0284c7';
                bgColor = 'rgba(2, 132, 199, 0.75)';

                tableHTML = `<table class="stat-table">
                    <thead><tr><th>ช่วงเวลา (Time of Day)</th><th>เฉลี่ยผู้เข้าชม</th><th>ช่วงเวลายอดนิยม</th></tr></thead>
                    <tbody>` + stats.hourlyHistory.map(h => `<tr><td>${h.time}</td><td><strong>${formatNum(h.visits)}</strong> คน</td><td>${h.visits > 300 ? '🔥 หนาแน่นสูงสุด' : 'ปกติ'}</td></tr>`).join('') + `</tbody></table>`;
            }

            document.getElementById('tableContainer').innerHTML = tableHTML;

            myChart = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: chartLabel,
                        data: datasetValues,
                        borderColor: borderColor,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        fill: chartType === 'line',
                        tension: 0.35,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f1f5f9' },
                            ticks: { font: { family: 'Sarabun' } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { family: 'Sarabun' } }
                        }
                    }
                }
            });
        }
    </script>

    <script>
        if (window.location.search.includes('report=1')) {
            document.body.style.backgroundColor = '#0f172a';
            window.addEventListener('load', function() {
                document.getElementById('reportModal').style.display = 'flex';
                renderReportChart('daily');
            });
        }
    </script>
</body>

</html>
