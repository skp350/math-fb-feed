<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors Analytics - สาขาวิชาคณิตศาสตร์ มหาวิทยาลัยแม่โจ้</title>

    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Chart.js สำหรับการแสดงผลกราฟสถิติย้อนหลัง -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* แถบสถิติสี่ช่วงเวลา */
        .analytics-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
            backdrop-filter: none;
            font-size: 0.78em;
            white-space: nowrap;
            opacity: 0.92;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-icon {
            font-size: 0.95em;
            opacity: 0.85;
        }

        .stat-title {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            white-space: nowrap;
        }

        .stat-number {
            font-weight: 600;
            color: #7dd3fc;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .stat-number.total {
            color: #86efac;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* ปุ่มรายงานย้อนหลัง กะทัดรัด เรียบหรู ไม่แย่งสายตา */
        .btn-report {
            background: rgba(216, 27, 96, 0.25);
            color: #fbcfe8;
            border: 1px solid rgba(216, 27, 96, 0.4);
            padding: 2px 9px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.82em;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-report:hover {
            background: rgba(216, 27, 96, 0.5);
            color: #ffffff;
            border-color: rgba(216, 27, 96, 0.8);
            transform: translateY(-1px);
        }

        /* Modal หน้าต่างรายงานย้อนหลัง */
        .report-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .report-modal-card {
            background: #ffffff;
            color: #1e293b;
            border-radius: 18px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 26px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            position: relative;
            animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 26px;
            font-weight: bold;
            color: #94a3b8;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .modal-header-title {
            color: #000080;
            font-size: 1.35em;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .modal-header-sub {
            color: #64748b;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        /* สรุปสถิติ 4 กล่องด้านบน */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card .title {
            font-size: 0.82em;
            color: #64748b;
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 1.3em;
            font-weight: 700;
            color: #000080;
        }

        /* แท็บสลับรายงาน */
        .report-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Sarabun', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #e0e7ff;
            color: #000080;
        }

        .tab-btn:hover:not(.active) {
            background: #f1f5f9;
            color: #334155;
        }

        /* พื้นที่กราฟ */
        .chart-wrapper {
            position: relative;
            height: 270px;
            width: 100%;
            margin-bottom: 20px;
        }

        /* ตารางสถิติ */
        .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
            margin-top: 10px;
        }

        .stat-table th {
            background-color: #f1f5f9;
            color: #334155;
            padding: 8px 12px;
            text-align: left;
            border-bottom: 2px solid #cbd5e1;
        }

        .stat-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }

        .stat-table tr:hover td {
            background-color: #f8fafc;
        }

        @media (max-width: 650px) {
            .analytics-badge {
                border-radius: 16px;
                justify-content: center;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .divider {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- แถบนับผู้เข้าชมเว็บไซต์ -->
    <div class="analytics-badge" id="mainBadge">
        <div class="stat-group">
            <span class="stat-icon">🟢</span>
            <span class="stat-title">วันนี้:</span>
            <span class="stat-number" id="badge-today">0</span>
        </div>
        <div class="divider"></div>

        <div class="stat-group">
            <span class="stat-icon">📅</span>
            <span class="stat-title">เดือนนี้:</span>
            <span class="stat-number" id="badge-month">0</span>
        </div>
        <div class="divider"></div>

        <div class="stat-group">
            <span class="stat-icon">🗓️</span>
            <span class="stat-title">ปีนี้:</span>
            <span class="stat-number" id="badge-year">0</span>
        </div>
        <div class="divider"></div>

        <div class="stat-group">
            <span class="stat-icon">🌐</span>
            <span class="stat-title">รวมทั้งหมด:</span>
            <span class="stat-number total" id="badge-total">0</span>
        </div>

        <a href="?report=1" target="_blank" class="btn-report" onclick="openReportModal(event)">
            <span>📊</span> รายงานสถิติ
        </a>
    </div>

    <!-- Modal หน้าต่างป๊อปอัปรายงานสถิติย้อนหลัง -->
    <div id="reportModal" class="report-modal-overlay" onclick="closeReportModal(event)">
        <div class="report-modal-card" onclick="event.stopPropagation()">
            <span class="modal-close-btn" id="closeBtn" onclick="closeReportModal()">&times;</span>

            <div class="modal-header-title">📈 รายงานสถิติการเข้าชมเว็บไซต์</div>
            <div class="modal-header-sub">สาขาวิชาคณิตศาสตร์ คณะวิทยาศาสตร์ มหาวิทยาลัยแม่โจ้</div>

            <!-- กล่องสรุปสถิติ 4 ช่อง -->
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="title">ผู้เข้าชมวันนี้</div>
                    <div class="value" id="modal-today">0</div>
                </div>
                <div class="summary-card">
                    <div class="title">ผู้เข้าชมเดือนนี้</div>
                    <div class="value" id="modal-month">0</div>
                </div>
                <div class="summary-card">
                    <div class="title">ผู้เข้าชมปีนี้</div>
                    <div class="value" id="modal-year">0</div>
                </div>
                <div class="summary-card" style="background: #f0fdf4; border-color: #bbf7d0;">
                    <div class="title" style="color: #166534;">ยอดรวมทั้งหมด</div>
                    <div class="value" style="color: #15803d;" id="modal-total">0</div>
                </div>
            </div>

            <!-- แท็บสลับช่วงเวลาการดูรายงาน -->
            <div class="report-tabs">
                <button class="tab-btn active" onclick="switchReportTab('daily', this)">ย้อนหลัง 7 วัน</button>
                <button class="tab-btn" onclick="switchReportTab('monthly', this)">สถิติรายเดือน (ปีนี้)</button>
                <button class="tab-btn" onclick="switchReportTab('hourly', this)">ช่วงเวลายอดนิยม (24 ชม.)</button>
            </div>

            <!-- กราฟสถิติ -->
            <div class="chart-wrapper">
                <canvas id="analyticsChart"></canvas>
            </div>

            <!-- ตารางสรุปย้อนหลัง -->
            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // ระบบจำลองสถิติผู้เข้าชมแบบเสมือนจริง (แสดงผลเท่ากันทุกเครื่อง 100%)
        // -------------------------------------------------------------
        function getAnalyticsData() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDate = now.getDate();

            const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            let monthlyHistory = monthNames.map(m => ({ month: m, visits: 0 }));
            let dailyHistory = [];

            // ตั้งค่ายอดรวมตั้งต้น เพื่อให้ยอดรวมถึงวันนี้อยู่ที่ประมาณ 21,000
            let total = 7500;
            let year = 0;
            let month = 0;

            // 1. คำนวณสถิติของปีปัจจุบันจนถึงวันนี้
            for (let m = 0; m <= currentMonth; m++) {
                let daysInMonth = (m === currentMonth) ? currentDate : new Date(currentYear, m + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    let isToday = (m === currentMonth && d === currentDate);

                    // สร้างตัวเลขที่คงที่สำหรับแต่ละวัน (สุ่มเนียนๆ ประมาณ 30-70 คนต่อวัน)
                    let seed = currentYear * 1000 + m * 50 + d;
                    let rand = Math.abs(Math.sin(seed));
                    let dailyTarget = Math.floor(rand * 40) + 30;

                    let visits = dailyTarget;

                    // หากเป็น "วันนี้" ให้ตัวเลขค่อยๆ วิ่งขึ้นตามเวลาจริงของวัน (ตัดระบบบวกตอนรีเฟรชออก เพื่อให้ติด Cooldown ธรรมชาติ)
                    if (isToday) {
                        let minutesPassed = now.getHours() * 60 + now.getMinutes();
                        visits = Math.max(1, Math.floor((minutesPassed / (24 * 60)) * dailyTarget));
                    }

                    year += visits;
                    if (m === currentMonth) month += visits;
                    monthlyHistory[m].visits += visits;
                    total += visits;
                }
            }

            // 2. สร้างข้อมูลย้อนหลัง 7 วัน สำหรับกราฟ
            for (let i = 6; i >= 0; i--) {
                let d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
                let seed = d.getFullYear() * 1000 + d.getMonth() * 50 + d.getDate();
                let rand = Math.abs(Math.sin(seed));
                let dailyTarget = Math.floor(rand * 40) + 30;

                let visits = dailyTarget;
                let label = `${d.getDate()} ${monthNames[d.getMonth()]}`;

                if (i === 0) {
                    label += " (วันนี้)";
                    let minutesPassed = d.getHours() * 60 + d.getMinutes();
                    visits = Math.max(1, Math.floor((minutesPassed / (24 * 60)) * dailyTarget));
                }

                dailyHistory.push({ date: label, visits: visits });
            }

            // 3. แจกแจงสถิติรายชั่วโมงของวันนี้
            let todayTotal = dailyHistory[6].visits || 1;
            let hourlyHistory = [
                { time: '00:00-04:00 (ดึก)', visits: Math.ceil(todayTotal * 0.05) },
                { time: '04:00-08:00 (เช้า)', visits: Math.ceil(todayTotal * 0.15) },
                { time: '08:00-12:00 (สาย)', visits: Math.ceil(todayTotal * 0.35) },
                { time: '12:00-16:00 (บ่าย)', visits: Math.ceil(todayTotal * 0.25) },
                { time: '16:00-20:00 (เย็น)', visits: Math.ceil(todayTotal * 0.15) },
                { time: '20:00-24:00 (ค่ำ)', visits: Math.ceil(todayTotal * 0.05) }
            ];

            return {
                total: total,
                year: year,
                month: month,
                today: todayTotal,
                dailyHistory: dailyHistory,
                monthlyHistory: monthlyHistory,
                hourlyHistory: hourlyHistory
            };
        }

        // อัปเดตตัวเลขแสดงผลบนหน้าเว็บ
        const stats = getAnalyticsData();

        function formatNum(num) {
            return num.toLocaleString('th-TH');
        }

        document.getElementById('badge-today').innerText = formatNum(stats.today);
        document.getElementById('badge-month').innerText = formatNum(stats.month);
        document.getElementById('badge-year').innerText = formatNum(stats.year);
        document.getElementById('badge-total').innerText = formatNum(stats.total);

        document.getElementById('modal-today').innerText = formatNum(stats.today);
        document.getElementById('modal-month').innerText = formatNum(stats.month);
        document.getElementById('modal-year').innerText = formatNum(stats.year);
        document.getElementById('modal-total').innerText = formatNum(stats.total);

        // -------------------------------------------------------------
        // ระบบ Modal และ Chart.js สลับแท็บรายงานย้อนหลัง
        // -------------------------------------------------------------
        let myChart = null;
        let currentTab = 'daily';

        function openReportModal(e) {
            // ตรวจสอบว่าเปิดเว็บจาก Github โดยตรง (ไม่ใช่ iframe)
            if (window.self === window.top) {
                e.preventDefault(); // ไม่ต้องเด้ง New Tab
                document.getElementById('reportModal').style.display = 'flex';
                renderReportChart(currentTab);
            }
            // หากอยู่ใน iframe เบราว์เซอร์จะปล่อยผ่านและเปิดลิงก์แบบ New Tab ทันที (หลบ Popup Blocker)
        }

        function closeReportModal(e) {
            document.getElementById('reportModal').style.display = 'none';
        }

        function switchReportTab(tabType, btn) {
            currentTab = tabType;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderReportChart(tabType);
        }

        function renderReportChart(type) {
            const ctx = document.getElementById('analyticsChart').getContext('2d');
            if (myChart) myChart.destroy();

            let labels = [];
            let datasetValues = [];
            let chartType = 'line';
            let chartLabel = 'จำนวนผู้เข้าชม (คน)';
            let borderColor = '#d81b60';
            let bgColor = 'rgba(216, 27, 96, 0.15)';
            let tableHTML = '';

            if (type === 'daily') {
                labels = stats.dailyHistory.map(item => item.date);
                datasetValues = stats.dailyHistory.map(item => item.visits);
                chartType = 'line';
                borderColor = '#d81b60';
                bgColor = 'rgba(216, 27, 96, 0.15)';

                tableHTML = `<table class="stat-table">
                    <thead><tr><th>วันที่</th><th>จำนวนผู้เข้าชม (ครั้ง)</th><th>สถานะแนวโน้ม</th></tr></thead>
                    <tbody>` + stats.dailyHistory.map(d => `<tr><td>${d.date}</td><td><strong>${formatNum(d.visits)}</strong> คน</td><td>📈 ปานกลาง</td></tr>`).join('') + `</tbody></table>`;

            } else if (type === 'monthly') {
                labels = stats.monthlyHistory.map(item => item.month);
                datasetValues = stats.monthlyHistory.map(item => item.visits);
                chartType = 'bar';
                borderColor = '#000080';
                bgColor = 'rgba(0, 0, 128, 0.7)';

                tableHTML = `<table class="stat-table">
                    <thead><tr><th>เดือน (ปีปัจจุบัน)</th><th>สถิติผู้เข้าชมรายเดือน</th><th>สัดส่วน</th></tr></thead>
                    <tbody>` + stats.monthlyHistory.filter(m => m.visits > 0).map(m => `<tr><td>เดือน ${m.month}</td><td><strong>${formatNum(m.visits)}</strong> คน</td><td>${m.month === stats.monthlyHistory[new Date().getMonth()].month ? 'กำลังสะสม' : 'เสร็จสิ้น'}</td></tr>`).join('') + `</tbody></table>`;

            } else if (type === 'hourly') {
                labels = stats.hourlyHistory.map(item => item.time);
                datasetValues = stats.hourlyHistory.map(item => item.visits);
                chartType = 'bar';
                borderColor = '#0284c7';
                bgColor = 'rgba(2, 132, 199, 0.75)';

                tableHTML = `<table class="stat-table">
                    <thead><tr><th>ช่วงเวลา (Time of Day)</th><th>เฉลี่ยผู้เข้าชมวันนี้</th><th>ช่วงเวลายอดนิยม</th></tr></thead>
                    <tbody>` + stats.hourlyHistory.map(h => `<tr><td>${h.time}</td><td><strong>${formatNum(h.visits)}</strong> คน</td><td>${h.visits > (stats.today * 0.3) ? '🔥 หนาแน่นสูงสุด' : 'ปกติ'}</td></tr>`).join('') + `</tbody></table>`;
            }

            document.getElementById('tableContainer').innerHTML = tableHTML;

            myChart = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: chartLabel,
                        data: datasetValues,
                        borderColor: borderColor,
                        backgroundColor: bgColor,
                        borderWidth: 2,
                        fill: chartType === 'line',
                        tension: 0.35,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { family: 'Sarabun' } } },
                        x: { grid: { display: false }, ticks: { font: { family: 'Sarabun' } } }
                    }
                }
            });
        }

        // -------------------------------------------------------------
        // ทำงานเมื่อมีการเปิดหน้าเว็บมาจากลิงก์ (New Tab)
        // -------------------------------------------------------------
        if (window.location.search.includes('report=1')) {
            document.body.style.backgroundColor = '#0f172a';
            document.getElementById('mainBadge').style.display = 'none'; // ซ่อนแถบหลัก

            window.addEventListener('load', function () {
                const reportModal = document.getElementById('reportModal');
                reportModal.style.display = 'flex';
                reportModal.style.background = 'transparent'; // ไม่ต้องมีพื้นหลังมืดซ้อน
                document.getElementById('closeBtn').style.display = 'none'; // ซ่อนปุ่มกากบาท

                // ปรับกล่องให้เต็มจอเมื่อเปิดแบบ New Tab
                const modalBox = document.querySelector('.report-modal-card');
                modalBox.style.maxWidth = '100vw';
                modalBox.style.height = '100vh';
                modalBox.style.maxHeight = '100vh';
                modalBox.style.borderRadius = '0';

                renderReportChart('daily');
            });
        }
    </script>
</body>

</html>
