<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitors Counter - MJU Math</title>
  
  <!-- Google Fonts: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: transparent;
      font-family: 'Sarabun', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      color: #ffffff;
    }
    .counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9em;
    }
    .label {
      color: #ffffff;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-img {
      height: 20px;
      vertical-align: middle;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="counter-badge">
    <span class="label">ผู้เข้าชมเว็บไซต์:</span>
    <!-- Real-Time Visitor Counter (ขยับนับ +1 จริงทุกครั้งที่เปิด/รีเฟรช) -->
    <img id="counter-img" class="badge-img" 
         src="https://api.visitorbadge.io/api/visitors?path=math_mju_ac_th_counter&label=Visitors&labelColor=%232d3748&countColor=%23d81b60&style=flat" 
         alt="Visitors Counter" />
  </div>

</body>
</html>
