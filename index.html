<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ป้องกัน Facebook บล็อกการดึงรูปข้ามโดเมน -->
    <meta name="referrer" content="no-referrer">
    <title>Facebook 6 Feeds - สาขาวิชาคณิตศาสตร์ ม.แม่โจ้</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: #ffffff;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        /* เลย์เอาต์ 6 ข่าว */
        .feed-container-6 {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .news-card-6 {
            width: calc(33.333% - 8px);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 430px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .news-card-6:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }

        .news-card-6.youtube-card {
            border: 1px solid #fca5a5;
            background: #fff5f5;
        }

        .card-img-wrapper {
            width: 100%;
            height: 270px;
            background: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .card-content {
            padding: 12px 14px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .author-info {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 6px;
        }

        .author-date {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        .card-text {
            font-size: 12px;
            color: #334155;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .read-more {
            font-size: 11px;
            color: #2563eb;
            font-weight: 600;
            display: inline-block;
        }

        .read-more.yt-more {
            color: #dc2626;
        }

        @media (max-width: 768px) {
            .news-card-6 {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="feed-container-6" id="feed-container"></div>

                pubDate: "2026-09-29T01:06:16Z",

                description: "𝗠𝗢𝗕𝗜𝗟𝗜𝗧𝗬 𝗥𝗘𝗙𝗟𝗘𝗖𝗧𝗜𝗢𝗡𝗦 The exchange experience at Maejo University brought together learning, collaboration, and cultural exchange through the Department of Mathematics, Faculty of Science.",

                thumbnail: "https://scontent-sof1-2.xx.fbcdn.net/v/t39.30808-6/824025020_1035349496218277_5366344858018745021_n.jpg?stp=dst-jpg_p720x720_tt6&_nc_cat=107&ccb=1-7&_nc_sid=127cfc&_nc_ohc=mwXe438t5xcQ7kNvwGcpxGx&_nc_oc=AdqOG_-dPL0PBwpnaTaK05wppn3nTXzM5448pox1h-jaYLn3BgVg91eA5GVSxKBNzmg&_nc_zt=23&_nc_ht=scontent-sof1-2.xx&edm=AJdBtusEAAAA&_nc_gid=4rn6l9KdOBfJEXqnsJOZVg&_nc_tpa=Q5bMBQJ-aEJ4W_r9qLxyXjGEn2EHV1Y4D8xNTjaVL-vaV_ajJUOwNP2NskF7DM4yC65sxEhnRmk0PdI2&oh=00_AQOKpI4mwgNEEJ7zRSsHCQ4lKBHcNSoli77Ck2UMsqyCKg&oe=6ADBFBCD",
                link: "https://www.facebook.com/1576197564303377/posts/1598529438736856"
            },
            {
                title: "𝗠𝗢𝗕𝗜𝗟𝗜𝗧𝗬 𝗥𝗘𝗙𝗟𝗘𝗖𝗧𝗜𝗢𝗡𝗦",
                description: "𝗠𝗢𝗕𝗜𝗟𝗜𝗧𝗬 𝗥𝗘𝗙𝗟𝗘𝗖𝗧𝗜𝗢𝗡𝗦 Every mobility experience brings new lessons, perspectives, and connections. Through the Faculty and Student Exchange Program at Maejo University, PSAU participants engaged with the Department of Mathematics.",

                link: "https://www.facebook.com/1576197564303377/posts/1598529358736864"
            },
            {
                title: "𝗠𝗢𝗕𝗜𝗟𝗜𝗧𝗬 𝗥𝗘𝗙𝗟𝗘𝗖𝗧𝗜𝗢𝗡𝗦",
                description: "𝗠𝗢𝗕𝗜𝗟𝗜𝗧𝗬 𝗥𝗘𝗙𝗟𝗘𝗖𝗧𝗜𝗢𝗡𝗦 The exchange at Maejo University opened opportunities for PSAU faculty and students to engage, learn, and connect with an international academic community.",
                pubDate: "2026-09-29T01:05:48Z",
                thumbnail: "https://scontent-sof1-2.xx.fbcdn.net/v/t39.30808-6/824485091_1035350229551537_1073138186679845529_n.jpg?stp=dst-jpg_p720x720_tt6&_nc_cat=109&ccb=1-7&_nc_sid=127cfc&_nc_ohc=AxUe4OwtCBMQ7kNvwFyLVJv&_nc_oc=AdpCA2-jDzWr1ykE5z-jNdVDY4diHyHlYZGl7rNR_2svKwPM34a-pGTRB8ni3ba2Tpk&_nc_zt=23&_nc_ht=scontent-sof1-2.xx&edm=AJdBtusEAAAA&_nc_gid=4rn6l9KdOBfJEXqnsJOZVg&_nc_tpa=Q5bMBQIldgtzUwm4hqt6Blsqi6KlWaXH7aYm6kFa8FvNGiFm8kbUxAihSnP258fqZy8Drt2r_0k9668w&oh=00_AQMJfO9NhEVwkZKwn3dffvK6pmovgTUiYc53y6wf_eDSWg&oe=6ADBEEE6",
                link: "https://www.facebook.com/1576197564303377/posts/1598529208736879"
            }

        function renderFeeds(items) {
            let posts = (items || []).slice(0, 5);
            posts.push({
                title: "🎬 แนะนำคณะวิทยาศาสตร์ มหาวิทยาลัยแม่โจ้",
                description: "วิดีโอแนะนำหลักสูตร และการเรียนการสอน คณะวิทยาศาสตร์ มหาวิทยาลัยแม่โจ้ (คลิกเพื่อรับชมบน YouTube)",
                pubDate: "วิดีโอแนะนำ",
                thumbnail: "https://img.youtube.com/vi/EghnSl8vNtE/hqdefault.jpg",
                link: "https://www.youtube.com/watch?v=EghnSl8vNtE",
                isYoutube: true
            });

            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            posts.forEach(post => {
                const dateStr = post.isYoutube ? 'วิดีโอแนะนำ' : (post.pubDate ? new Date(post.pubDate).toLocaleDateString('th-TH', { month: 'short', day: 'numeric' }) : 'ล่าสุด');

                let cleanText = '';
                if (post.isYoutube) {
                    cleanText = post.description;
                } else {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = post.description || post.content || post.title || '';
                    const spans = tempDiv.querySelectorAll('span');
                    spans.forEach(s => { if (s.innerText.includes('FetchRSS')) s.remove(); });

                    cleanText = tempDiv.textContent || tempDiv.innerText || '';
                    cleanText = cleanText.replace(/\(Feed generated with FetchRSS\)/gi, '').trim().replace(/\s+/g, ' ');
                    if (!cleanText || cleanText.length < 5) cleanText = post.title || 'โพสต์ข่าวสารกิจกรรม สาขาวิชาคณิตศาสตร์ มหาวิทยาลัยแม่โจ้';
                }

                let imgUrl = post.thumbnail || (post.enclosure && post.enclosure.link);
                if (!imgUrl && post.description) {
                    const imgMatch = post.description.match(/src=["'](.*?)["']/);
                    if (imgMatch) imgUrl = imgMatch[1].replace(/&amp;/g, '&');
                }
                if (imgUrl) {
                    imgUrl = imgUrl.replace(/&amp;/g, '&');
                } else {
                    imgUrl = defaultFallbackImg;
                }

                // ตัวสำรองผ่าน Image Proxy หากลิงก์ตรงของ Facebook บล็อก
                const proxyImgUrl = (!post.isYoutube && imgUrl.startsWith('http'))
                    ? 'https://wsrv.nl/?url=' + encodeURIComponent(imgUrl)
                    : defaultFallbackImg;

                container.innerHTML += `
            <a href="${post.link || fbPageUrl}" target="_blank" class="news-card-6 ${post.isYoutube ? 'youtube-card' : ''}">
              <div class="card-img-wrapper">
                <img class="card-img" src="${imgUrl}" referrerpolicy="no-referrer" alt="Card Image"
                     onerror="if(!this.dataset.triedProxy){this.dataset.triedProxy='1';this.src='${proxyImgUrl}';}else{this.onerror=null;this.src='${defaultFallbackImg}';}">
                ${post.isYoutube ? '<div class="play-btn">▶</div>' : ''}
              </div>
              <div class="card-content">
                <div>
                  <div class="author-info">
                    <span class="author-date">📅 ${dateStr}</span>
                  </div>
                  <p class="card-text">${cleanText}</p>
                </div>
                <div>
                  <span class="read-more ${post.isYoutube ? 'yt-more' : ''}">${post.isYoutube ? 'รับชมบน YouTube ➔' : 'Read More ➔'}</span>
                </div>
              </div>
            </a>
          `;
            });
        }

        function fetchWithTimeout(url, timeout = 3500) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeout))
            ]);
        }

        function parseRssXml(xmlText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const items = Array.from(xmlDoc.querySelectorAll("item"));
            return items.map(item => {
                const title = item.querySelector("title")?.textContent || "";
                const link = item.querySelector("link")?.textContent || fbPageUrl;
                const description = item.querySelector("description")?.textContent || "";
                const pubDate = item.querySelector("pubDate")?.textContent || "";
                const mediaContent = item.getElementsByTagNameNS("*", "content")[0] || item.querySelector("media\\:content, content");
                const thumbnail = mediaContent ? mediaContent.getAttribute("url") : "";
                return { title, link, description, pubDate, thumbnail };
            });
        }

        renderFeeds(initialPosts);

        (async function updateLiveFeedInBackground() {
            const proxies = [
                'https://api.allorigins.win/raw?url=' + encodeURIComponent(myRealRssUrl),
                'https://corsproxy.io/?' + encodeURIComponent(myRealRssUrl),
                'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(myRealRssUrl)
            ];
            for (const url of proxies) {
                try {
                    const res = await fetchWithTimeout(url, 3500);
                    if (res.ok) {
                        if (url.includes('rss2json')) {
                            const data = await res.json();
                            if (data.items && data.items.length > 0) {
                                renderFeeds(data.items);
                                return;
                            }
                        } else {
                            const text = await res.text();
                            const parsed = parseRssXml(text);
                            if (parsed.length > 0) {
                                renderFeeds(parsed);
                                return;
                            }
                        }
                    }
                } catch (e) { }
            }
        })();
    </script>
